<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple contact form">
  <title>Contact Form</title>
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <p>Fill out the form below and we will get back to you.</p>
  </header>

  <main>
    <form action="#" method="post">
      <div>
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="full_name" autocomplete="name" required>
      </div>

      <div>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div>
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <div>
        <button type="submit">Send message</button>
        <button type="reset">Clear form</button>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Contact Form</p>
  </footer>
</body>
</html>
